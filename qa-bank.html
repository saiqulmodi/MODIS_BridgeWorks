<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BridgeWorks: Civil Engineering & Physics Q/A Portal</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #334155; padding-bottom: 12px; flex-wrap: wrap; gap: 10px; }
        .badge { background: #0284c7; padding: 6px 12px; border-radius: 6px; font-weight: bold; }
        .reset-badge { background: #475569; padding: 6px 12px; border-radius: 6px; font-size: 13px; }
        .card { background: #1e293b; border-radius: 8px; padding: 18px; margin-top: 15px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
        .option-btn { display: block; width: 100%; text-align: left; background: #334155; color: white; border: none; padding: 12px; margin: 8px 0; border-radius: 6px; font-size: 15px; cursor: pointer; transition: background 0.2s; }
        .option-btn:hover { background: #0284c7; }
        .voice-btn { background: #334155; color: #38bdf8; border: 1px solid #475569; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .voice-btn:hover { background: #0284c7; color: white; }
        .reset-btn { background: #b91c1c; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .reset-btn:disabled { background: #475569; cursor: not-allowed; opacity: 0.6; }
        .feedback { margin-top: 10px; font-weight: bold; padding: 10px; border-radius: 6px; display: none; }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h2 style="margin:0 0 4px 0;">MODIS BridgeWorks: Engineering & NCERT Mastery</h2>
            <span id="timer-display" class="reset-badge">Calculating unlock timer...</span>
            <button id="reset-btn" class="reset-btn" onclick="resetScore()" disabled>Reset Score</button>
        </div>
        <div>
            Score: <span id="score" class="badge">0</span> | Treasury Subsidies: <span id="treasury" class="badge">₹0</span>
        </div>
    </div>
    <div id="quiz-container"></div>
    <script src="qa-manager.js"></script>
</body>
</html>
